name: sftpgo

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: sftpgo-db
    hostname: sftpgo-db
    restart: always
    network_mode: "none"
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 150
    mem_reservation: 256m
    environment:
      POSTGRES_DB_FILE: /run/secrets/db_name
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command:
      - "postgres"
      - "-c"
      - "unix_socket_directories=/var/run/postgresql"
      - "-c"
      - "listen_addresses="
    secrets:
      - db_name
      - db_user
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$(cat /run/secrets/db_password)\" psql -U \"$$(cat /run/secrets/db_user)\" -d \"$$(cat /run/secrets/db_name)\" -h /var/run/postgresql -c 'select 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
    volumes:
      - postgres_socket:/var/run/postgresql
      - ./postgres:/var/lib/postgresql:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  sftpgo:
    image: ghcr.io/underhax/sftpgo-docker:${SFTPGO_VERSION:-latest}
    container_name: sftpgo-app
    hostname: sftpgo-app
    restart: always
    user: "${APP_UID}:${APP_GID}"
    read_only: true
    cap_drop:
      - ALL
    cap_add: []
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024m
          pids: 100
    mem_reservation: 256m
    env_file:
      - .env
    environment:
      SFTPGO_SFTPD__BINDINGS__0__PORT: "${SFTP_PORT:-0}"
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_PORT:-54480}:8081"
      # - "${HOST_IP}:${SFTP_HOST_PORT}:${SFTP_PORT}"
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,nodev,size=64m
      - /run:mode=1777,noexec,nosuid,nodev,size=16m
    volumes:
      - postgres_socket:/var/run/postgresql
      - ./data:/data:rw,noexec,nosuid,nodev
      - ./logs:/var/log/sftpgo:rw,noexec,nosuid,nodev
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - db_name
      - db_user
      - db_password
      # - sftpgo_admin_user
      # - sftpgo_admin_password
      # - sftpgo_kms_master_key
      # - sftpgo_oidc_config_url
      # - sftpgo_oidc_client_id
      # - sftpgo_oidc_client_secret
      # - sftpgo_oidc_redirect_url
      # - ssh_host_ed25519_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/probe"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - frontend_gateway
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_socket:
    name: sftpgo_postgres_socket
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=8m,mode=0700,uid=${APP_UID},gid=${APP_GID},noexec,nosuid,nodev"

secrets:
  db_name:
    file: ./secrets/db_name.txt
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
  # sftpgo_admin_user:
  #   file: ./secrets/sftpgo_admin_user.txt
  # sftpgo_admin_password:
  #   file: ./secrets/sftpgo_admin_password.txt
  # sftpgo_kms_master_key:
  #   file: ./secrets/sftpgo_kms_master_key.txt
  # sftpgo_oidc_config_url:
  #   file: ./secrets/sftpgo_oidc_config_url.txt
  # sftpgo_oidc_client_id:
  #   file: ./secrets/sftpgo_oidc_client_id.txt
  # sftpgo_oidc_client_secret:
  #   file: ./secrets/sftpgo_oidc_client_secret.txt
  # sftpgo_oidc_redirect_url:
  #   file: ./secrets/sftpgo_oidc_redirect_url.txt
  # ssh_host_ed25519_key:
  #   file: ./secrets/ssh_host_ed25519_key

networks:
  frontend_gateway:
    external: true
